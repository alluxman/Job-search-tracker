<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Search Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
</head>
<body>

    <h1>Job / Internship Search Tracker</h1>

    <h2>Add a new application</h2>

    <form id="applicationForm">
        <label for="position">Position</label>
        <input type="text" name="position" id="position" required>

        <label for="company">Company</label>
        <input type="text" name="company" id="company" required>

        <label for="jobLink">Job link</label>
        <input type="url" name="jobLink" id="jobLink" required>

        <label for="applicationDeadline">Application deadline</label>
        <input type="date" name="applicationDeadline" id="applicationDeadline">

        <button type="submit">Add application</button>
    </form>

    <h2>My applications</h2>

    <p id="applicationCounter">Total applications: 0</p>

    <div id="applicationList">
        
    </div>

</body>
</html>
